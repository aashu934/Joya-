name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Update project files
        run: |
          if [ "$(cat .jarvis_version 2>/dev/null)" != "4" ]; then
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.ANSWER_PHONE_CALLS" />
              <uses-permission android:name="android.permission.READ_PHONE_STATE" />
              <uses-permission android:name="android.permission.READ_CALL_LOG" />
              <uses-permission android:name="android.permission.SEND_SMS" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission
                  android:name="android.permission.BLUETOOTH"
                  android:maxSdkVersion="30" />
              <uses-permission
                  android:name="android.permission.BLUETOOTH_ADMIN"
                  android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />

              <queries>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="false"
                  android:icon="@drawable/dp"
                  android:label="Jarvis"
                  android:theme="@android:style/Theme.Material.Light">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name=".SettingsActivity"
                      android:exported="false" />

                  <service
                      android:name=".VoiceService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />

                  <service
                      android:name=".AutoSendService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          EOF
          mkdir -p app/src/main/java/com/example/jarvis
          cat > app/src/main/java/com/example/jarvis/MainActivity.kt <<'EOF'
          package com.example.jarvis
          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Outline
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.view.View
          import android.view.ViewOutlineProvider
          import android.widget.Button
          import android.widget.FrameLayout
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          class MainActivity : Activity() {
              private lateinit var avatar: ImageView
              private lateinit var status: TextView
              private lateinit var micBtn: Button
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val d = resources.displayMetrics.density
                  val root = FrameLayout(this)
                  root.setBackgroundColor(Color.parseColor("#2B1650"))
                  val col = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                  }
                  avatar = ImageView(this).apply {
                      setImageResource(R.drawable.dp)
                      layoutParams = LinearLayout.LayoutParams((250 * d).toInt(), (250 * d).toInt())
                      clipToOutline = true
                      outlineProvider = object : ViewOutlineProvider() {
                          override fun getOutline(view: View, outline: Outline) {
                              outline.setRoundRect(0, 0, view.width, view.height, view.width / 2f)
                          }
                      }
                  }
                  col.addView(avatar)
                  status = TextView(this).apply {
                      textSize = 18f
                      setTextColor(Color.WHITE)
                      gravity = Gravity.CENTER
                      setPadding(0, (24 * d).toInt(), 0, (24 * d).toInt())
                  }
                  col.addView(status)
                  micBtn = Button(this).apply {
                      textSize = 30f
                      val bg = GradientDrawable()
                      bg.shape = GradientDrawable.OVAL
                      bg.setColor(Color.parseColor("#FF4F8B"))
                      background = bg
                      layoutParams = LinearLayout.LayoutParams((84 * d).toInt(), (84 * d).toInt())
                      setOnClickListener { toggle() }
                  }
                  col.addView(micBtn)
                  root.addView(
                      col,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  )
                  val gear = TextView(this).apply {
                      text = "⚙"
                      textSize = 30f
                      setTextColor(Color.WHITE)
                      setPadding((16 * d).toInt(), (16 * d).toInt(), (16 * d).toInt(), (16 * d).toInt())
                      setOnClickListener { startActivity(Intent(this@MainActivity, SettingsActivity::class.java)) }
                  }
                  val gp = FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.WRAP_CONTENT,
                      FrameLayout.LayoutParams.WRAP_CONTENT
                  )
                  gp.gravity = Gravity.TOP or Gravity.END
                  root.addView(gear, gp)
                  setContentView(root)
              }
              private fun toggle() {
                  if (UiBus.running) {
                      stopService(Intent(this, VoiceService::class.java))
                      UiBus.update("Band hai. Mic dabao", false)
                      return
                  }
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestAllPermissions(this)
                      Toast.makeText(this, "Permissions allow karke dobara mic dabao", Toast.LENGTH_LONG).show()
                      return
                  }
                  val i = Intent(this, VoiceService::class.java)
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(i) else startService(i)
                  UiBus.update("Shuru ho rahi hu...", true)
              }
              private fun refresh() {
                  status.text = UiBus.status
                  micBtn.text = if (UiBus.running) "⏹" else "🎤"
                  val s = if (UiBus.speakingNow) 1.07f else 1.0f
                  avatar.animate().scaleX(s).scaleY(s).setDuration(250).start()
              }
              override fun onResume() {
                  super.onResume()
                  UiBus.listener = { refresh() }
                  refresh()
              }
              override fun onPause() {
                  UiBus.listener = null
                  super.onPause()
              }
          }
          EOF
          cat > app/src/main/java/com/example/jarvis/SettingsActivity.kt <<'EOF'
          package com.example.jarvis
          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.speech.tts.TextToSpeech
          import android.speech.tts.Voice
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast
          import kotlin.math.abs
          fun requestAllPermissions(a: Activity) {
              val perms = mutableListOf(
                  Manifest.permission.RECORD_AUDIO,
                  Manifest.permission.CALL_PHONE,
                  Manifest.permission.SEND_SMS,
                  Manifest.permission.READ_CONTACTS,
                  Manifest.permission.READ_PHONE_STATE,
                  Manifest.permission.READ_CALL_LOG
              )
              if (Build.VERSION.SDK_INT >= 26) perms.add(Manifest.permission.ANSWER_PHONE_CALLS)
              if (Build.VERSION.SDK_INT >= 31) perms.add(Manifest.permission.BLUETOOTH_CONNECT)
              if (Build.VERSION.SDK_INT >= 33) perms.add(Manifest.permission.POST_NOTIFICATIONS)
              a.requestPermissions(perms.toTypedArray(), 1)
          }
          class SettingsActivity : Activity() {
              private var tts: TextToSpeech? = null
              private var voices: List<Voice> = emptyList()
              private var voiceIdx = -1
              private val pitches = floatArrayOf(1.0f, 1.2f, 1.35f, 1.5f, 1.7f)
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val d = resources.displayMetrics.density
                  val prefs = jarvisPrefs(this)
                  tts = TextToSpeech(this) { status ->
                      if (status == TextToSpeech.SUCCESS) {
                          val all = tts?.voices ?: emptySet<Voice>()
                          voices = all.filter {
                              (it.locale.language == "en" || it.locale.language == "hi") &&
                                  !it.features.contains("notInstalled")
                          }.sortedWith(compareBy<Voice>({ it.locale.language != "hi" }, { it.name }))
                      }
                  }
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding((20 * d).toInt(), (20 * d).toInt(), (20 * d).toInt(), (20 * d).toInt())
                  }
                  root.addView(TextView(this).apply {
                      text = "Settings"
                      textSize = 22f
                  })
                  root.addView(TextView(this).apply {
                      text = "AI dimaag ke liye: aistudio.google.com pe jaao, Get API key dabao (free), key yahan paste karo aur Save dabao. Key hogi to assistant Hindi me baat karegi aur sab kuch samjhegi."
                      textSize = 13f
                      setPadding(0, (8 * d).toInt(), 0, (8 * d).toInt())
                  })
                  val nameBox = EditText(this).apply {
                      hint = "Assistant ka naam (jaise Jarvis)"
                      setText(prefs.getString("name", "jarvis"))
                      setSingleLine(true)
                  }
                  val keyBox = EditText(this).apply {
                      hint = "Gemini API key"
                      setText(prefs.getString("api_key", ""))
                      setSingleLine(true)
                  }
                  val modelBox = EditText(this).apply {
                      hint = "Model (khali chhodo to automatic)"
                      setText(prefs.getString("model", ""))
                      setSingleLine(true)
                  }
                  root.addView(nameBox)
                  root.addView(keyBox)
                  root.addView(modelBox)
                  fun addButton(label: String, onClick: () -> Unit) {
                      root.addView(Button(this).apply {
                          text = label
                          setOnClickListener { onClick() }
                      })
                  }
                  addButton("Sab save karo (naam, key, model)") {
                      prefs.edit()
                          .putString("name", nameBox.text.toString().trim())
                          .putString("api_key", keyBox.text.toString().trim())
                          .putString("model", modelBox.text.toString().trim())
                          .apply()
                      Toast.makeText(this, "Save ho gaya. Home pe Stop dabake dobara Start karo", Toast.LENGTH_LONG).show()
                  }
                  addButton("1. Permissions do") { requestAllPermissions(this) }
                  addButton("2. Overlay permission (apps kholne ke liye)") {
                      startActivity(
                          Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName"))
                      )
                  }
                  addButton("3. WhatsApp auto-send (Accessibility ON karo)") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  addButton("Hindi awaaz install karo (TTS settings)") {
                      try {
                          startActivity(Intent("com.android.settings.TTS_SETTINGS"))
                      } catch (e: Exception) {
                          startActivity(Intent(Settings.ACTION_SETTINGS))
                      }
                  }
                  addButton("Awaaz badlo (dabate jao, sunte jao)") { nextVoice() }
                  addButton("Awaaz patli / mothi (pitch)") { nextPitch() }
                  val scroll = ScrollView(this)
                  scroll.addView(root)
                  setContentView(scroll)
              }
              private fun sample(v: Voice?) {
                  val hi = v?.locale?.language == "hi"
                  val text = if (hi) "नमस्ते, मैं आपकी असिस्टेंट हूँ। बताइए, क्या करना है?" else "Hello, I am your assistant"
                  tts?.speak(text, TextToSpeech.QUEUE_FLUSH, null, "s")
              }
              private fun nextVoice() {
                  if (voices.isEmpty()) {
                      Toast.makeText(this, "Koi awaaz nahi mili", Toast.LENGTH_SHORT).show()
                      return
                  }
                  voiceIdx = (voiceIdx + 1) % voices.size
                  val v = voices[voiceIdx]
                  tts?.voice = v
                  tts?.setPitch(jarvisPrefs(this).getFloat("pitch", 1.35f))
                  jarvisPrefs(this).edit().putString("voice_name", v.name).apply()
                  Toast.makeText(this, "Awaaz ${voiceIdx + 1}/${voices.size}: ${v.name}", Toast.LENGTH_SHORT).show()
                  sample(v)
              }
              private fun nextPitch() {
                  val p = jarvisPrefs(this)
                  val cur = p.getFloat("pitch", 1.35f)
                  val i = pitches.indexOfFirst { abs(it - cur) < 0.01f }
                  val next = pitches[(if (i < 0) 0 else i + 1) % pitches.size]
                  p.edit().putFloat("pitch", next).apply()
                  tts?.setPitch(next)
                  Toast.makeText(this, "Pitch: $next", Toast.LENGTH_SHORT).show()
                  sample(tts?.voice)
              }
              override fun onDestroy() {
                  tts?.stop()
                  tts?.shutdown()
                  super.onDestroy()
              }
          }
          EOF
          cat > app/src/main/java/com/example/jarvis/Brain.kt <<'EOF'
          package com.example.jarvis
          import android.content.Context
          import android.os.Handler
          import android.os.Looper
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL
          object UiBus {
              @Volatile
              var status: String = "Band hai. Mic dabao"
              @Volatile
              var running: Boolean = false
              @Volatile
              var speakingNow: Boolean = false
              @Volatile
              var listener: (() -> Unit)? = null
              private val main = Handler(Looper.getMainLooper())
              fun update(text: String, run: Boolean, speak: Boolean = false) {
                  status = text
                  running = run
                  speakingNow = speak
                  main.post { listener?.invoke() }
              }
          }
          private val DEV_CONS = mapOf(
              'क' to "k", 'ख' to "kh", 'ग' to "g", 'घ' to "gh", 'च' to "ch", 'छ' to "chh", 'ज' to "j", 'झ' to "jh",
              'ट' to "t", 'ठ' to "th", 'ड' to "d", 'ढ' to "dh", 'ण' to "n", 'त' to "t", 'थ' to "th", 'द' to "d",
              'ध' to "dh", 'न' to "n", 'प' to "p", 'फ' to "f", 'ब' to "b", 'भ' to "bh", 'म' to "m", 'य' to "y",
              'र' to "r", 'ल' to "l", 'व' to "v", 'श' to "sh", 'ष' to "sh", 'स' to "s", 'ह' to "h"
          )
          private val DEV_VOW = mapOf(
              'अ' to "a", 'आ' to "aa", 'इ' to "i", 'ई' to "ee", 'उ' to "u", 'ऊ' to "oo", 'ए' to "e",
              'ऐ' to "ai", 'ओ' to "o", 'औ' to "au", 'ऑ' to "o", 'ऋ' to "ri"
          )
          private val DEV_MATRA = mapOf(
              'ा' to "a", 'ि' to "i", 'ी' to "ee", 'ु' to "u", 'ू' to "oo", 'े' to "e",
              'ै' to "ai", 'ो' to "o", 'ौ' to "au", 'ॉ' to "o", 'ृ' to "ri"
          )
          fun latinize(src: String): String {
              val sb = StringBuilder()
              var i = 0
              while (i < src.length) {
                  val c = src[i]
                  val cons = DEV_CONS[c]
                  if (cons != null) {
                      sb.append(cons)
                      var j = i + 1
                      if (j < src.length && src[j] == '़') j++
                      val n = if (j < src.length) src[j] else ' '
                      val matra = DEV_MATRA[n]
                      if (matra != null) {
                          sb.append(matra)
                          j++
                      } else if (n == '्') {
                          j++
                      } else {
                          val last = j >= src.length || src[j] !in '\u0900'..'\u097F'
                          if (!last) sb.append("a")
                      }
                      i = j
                      continue
                  }
                  val v = DEV_VOW[c]
                  if (v != null) {
                      sb.append(v)
                  } else if (c == 'ं' || c == 'ँ') {
                      sb.append("n")
                  } else if (c in '\u0900'..'\u097F') {
                  } else {
                      sb.append(c)
                  }
                  i++
              }
              return sb.toString()
          }
          object Brain {
              class Reply(val say: String, val command: String)
              private val history = ArrayList<Pair<String, String>>()
              fun enabled(ctx: Context): Boolean =
                  (jarvisPrefs(ctx).getString("api_key", "") ?: "").isNotBlank()
              private fun systemPrompt(name: String): String = """
          You are "{NAME}", a sweet, cheerful, young Indian woman who is the voice assistant on the user's Android phone. The user speaks Hindi, English or Hinglish. Your replies are spoken aloud.
          STYLE:
          - Reply in natural, simple spoken Hindi written in Devanagari script. Common English words (WhatsApp, YouTube, call, message, movie, Google) can stay in English letters.
          - Be warm, friendly and SHORT: one or two sentences. No emojis, no markdown, no lists.
          - Use a pet name like "जान" only rarely, only when the user is being affectionate or romantic. Otherwise do not use any pet name.
          OUTPUT: Reply with ONLY a JSON object: {"say": "<what you speak>", "command": "<phone command or empty>"}
          "command" is "" or exactly ONE line in one of these formats (Roman letters, lowercase):
          open <app name>
          <contact name> ko call karo
          <contact name> ko call karo speaker pe
          <contact name> ko whatsapp karo <message text>
          <contact name> ko sms karo <message text>
          youtube par <song/video to play or search> search karo
          <movie name> movie chalao
          search karo <query>
          map pe <place> ka rasta dikhao
          bluetooth on karo
          bluetooth band karo
          speaker on karo
          speaker band karo
          RULES:
          - Contact names and app names must be written in Roman letters as the user said them. Message text goes in Roman letters (Hinglish) if it is Hindi.
          - Only put a command when the user wants something done on the phone. For chatting, general knowledge, advice or jokes, answer in "say" with command "".
          - For current things (news, scores, prices, weather, latest info) use command "search karo <query>" and say that you are searching.
          - For movie requests use command "<movie name> movie chalao" and say you are finding it on YouTube. Paid apps like Netflix cannot be opened to a specific movie.
          - Never claim you did something on the phone unless you gave a command for it.
          """.trimIndent().replace("{NAME}", name)
              fun ask(ctx: Context, userText: String, assistantName: String): Reply {
                  val prefs = jarvisPrefs(ctx)
                  val key = (prefs.getString("api_key", "") ?: "").trim()
                  val custom = (prefs.getString("model", "") ?: "").trim()
                  val models = ArrayList<String>()
                  if (custom.isNotEmpty()) models.add(custom)
                  models.add("gemini-3.1-flash-lite")
                  models.add("gemini-flash-latest")
                  val body = buildBody(userText, assistantName)
                  var lastCode = 0
                  for (m in models.distinct()) {
                      try {
                          val res = post(m, key, body)
                          lastCode = res.first
                          if (res.first in 200..299) {
                              val reply = parse(res.second)
                              if (reply != null) {
                                  remember(userText, reply)
                                  return reply
                              }
                              return Reply("मुझे समझ नहीं आया, फिर से बोलिए", "")
                          }
                          if (res.first == 401 || res.first == 403 || res.first == 429) break
                      } catch (e: Exception) {
                          lastCode = -1
                      }
                  }
                  val msg = when (lastCode) {
                      400, 401, 403 -> "लगता है API की चाबी या मॉडल का नाम गलत है। सेटिंग्स में जाँच लीजिए"
                      429 -> "अभी थोड़ी देर रुकिए, आज की लिमिट पूरी हो गई है"
                      -1 -> "इंटरनेट में कुछ दिक्कत है"
                      else -> "कुछ गड़बड़ हो गई, थोड़ी देर बाद कोशिश कीजिए"
                  }
                  return Reply(msg, "")
              }
              private fun remember(user: String, reply: Reply) {
                  val json = JSONObject().put("say", reply.say).put("command", reply.command).toString()
                  history.add(Pair(user, json))
                  while (history.size > 6) history.removeAt(0)
              }
              private fun buildBody(userText: String, name: String): String {
                  val contents = JSONArray()
                  for ((u, a) in history) {
                      contents.put(JSONObject().put("role", "user").put("parts", JSONArray().put(JSONObject().put("text", u))))
                      contents.put(JSONObject().put("role", "model").put("parts", JSONArray().put(JSONObject().put("text", a))))
                  }
                  contents.put(JSONObject().put("role", "user").put("parts", JSONArray().put(JSONObject().put("text", userText))))
                  return JSONObject()
                      .put(
                          "systemInstruction",
                          JSONObject().put("parts", JSONArray().put(JSONObject().put("text", systemPrompt(name))))
                      )
                      .put("contents", contents)
                      .put(
                          "generationConfig",
                          JSONObject()
                              .put("temperature", 0.8)
                              .put("maxOutputTokens", 1024)
                              .put("responseMimeType", "application/json")
                      )
                      .toString()
              }
              private fun post(model: String, key: String, body: String): Pair<Int, String> {
                  val url = URL("https://generativelanguage.googleapis.com/v1beta/models/$model:generateContent")
                  val conn = url.openConnection() as HttpURLConnection
                  try {
                      conn.requestMethod = "POST"
                      conn.connectTimeout = 8000
                      conn.readTimeout = 25000
                      conn.doOutput = true
                      conn.setRequestProperty("Content-Type", "application/json; charset=utf-8")
                      conn.setRequestProperty("x-goog-api-key", key)
                      conn.outputStream.use { it.write(body.toByteArray(Charsets.UTF_8)) }
                      val code = conn.responseCode
                      val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                      val text = stream?.bufferedReader(Charsets.UTF_8)?.use { it.readText() } ?: ""
                      return Pair(code, text)
                  } finally {
                      conn.disconnect()
                  }
              }
              private fun parse(text: String): Reply? {
                  return try {
                      val parts = JSONObject(text)
                          .getJSONArray("candidates").getJSONObject(0)
                          .getJSONObject("content").getJSONArray("parts")
                      val sb = StringBuilder()
                      for (i in 0 until parts.length()) sb.append(parts.getJSONObject(i).optString("text", ""))
                      var out = sb.toString().trim()
                      if (out.startsWith("```")) {
                          out = out.removePrefix("```json").removePrefix("```").removeSuffix("```").trim()
                      }
                      val j = JSONObject(out)
                      Reply(j.optString("say", "").trim(), j.optString("command", "").trim())
                  } catch (e: Exception) {
                      null
                  }
              }
          }
          EOF
          cat > app/src/main/java/com/example/jarvis/VoiceService.kt <<'EOF'
          package com.example.jarvis
          import android.Manifest
